name: Robot Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  BROWSER: Chrome
  HEADLESS: "true"
  TIMEOUT: 15s
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint (Robocop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint deps
        run: pip install -r requirements.txt
      - name: Robocop check
        run: robocop check Tests Resources Library

  test:
    name: API + UI tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Chrome (Selenium suites)
        uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt
      - name: Install Playwright browsers (Browser library)
        run: rfbrowser init || python -m Browser.entry init
      - name: Run tests in parallel
        run: |
          mkdir -p Results
          python -m pabot.pabot --processes 2 --pythonpath . \
            --variablefile config/prod.yaml --outputdir Results Tests
      - name: Summarize failures in job log
        if: always()
        run: |
          python -c "
          from robot.api import ExecutionResult
          r = ExecutionResult('Results/output.xml')
          def walk(s):
              for t in s.tests:
                  if t.status != 'PASS':
                      print('FAILED:', s.name, '::', t.name)
                      for kw in t.body:
                          if getattr(kw, 'status', '') == 'FAIL' and getattr(kw, 'message', ''):
                              print('   ', kw.message.splitlines()[0][:300]); break
              for sub in s.suites:
                  walk(sub)
          walk(r.suite)
          "
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: Results/
          retention-days: 14

  allure:
    name: Allure history report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt
      - name: Serial run with Allure listener (API suite)
        run: |
          mkdir -p Results/allure-results
          python -m robot --pythonpath . --variablefile config/prod.yaml \
            --outputdir Results \
            --listener "allure_robotframework;Results/allure-results" Tests/Backend
      - name: Generate static report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate Results/allure-results -o Results/allure-report --clean
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: Results/allure-report/
          retention-days: 14

name: Robot Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  BROWSER: Chrome
  HEADLESS: "true"
  TIMEOUT: 15s
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint (Robocop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint deps
        run: pip install "robocop>=5.4.0"
      - name: Robocop check
        run: robocop check Tests Resources Library || python -m robocop Tests Resources Library
        continue-on-error: true

  test:
    name: API + UI tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt
      - name: Install Playwright browsers (Browser library)
        run: rfbrowser init || python -m Browser.entry init
      - name: Run tests in parallel
        run: |
          mkdir -p Results
          python -m pabot.pabot --processes 2 --outputdir Results Tests
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: Results/
          retention-days: 14
